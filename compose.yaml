name: dcg-analytics

services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env          # DATABASE_URL (Neon), R2_*, CRON_SECRET, etc.
    environment:
      DEBUG: "False"
    command: sh -c "python manage.py migrate --noinput && gunicorn digimon_stats.wsgi:application -b 0.0.0.0:8000 --workers 3 --timeout 900"
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    depends_on:
      - backend
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          sleep $$(( 86400 - $$(date +%s) % 86400 ))
          curl -fsS -m 900 -H "Authorization: Bearer $$CRON_SECRET" \
            http://backend:8000/api/sync-cards/ || echo "sync failed"
        done

volumes:
  caddy_data:
  caddy_config:

