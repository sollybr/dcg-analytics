name: Sync Card Images

on:
  schedule:
    # 01:00 UTC daily, an hour after the Vercel cron that syncs card data (00:00 UTC),
    # so newly added cards already exist when images are matched to them.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        type: choice
        default: normal
        options:
          - normal      # skips images already synced
          - only-missing # skips any card that already has at least one image
          - force       # re-uploads everything
      workers:
        description: "Concurrent download/upload threads"
        default: "8"

concurrency:
  group: sync-card-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync card images
        env:
          # Adjust the database/Django names below to whatever digimon_stats/settings.py reads.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

          DIGIMON_IMAGE_SOURCE_TYPE: garage_cdn
          DIGIMON_STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

          # Optional: with these the sync lists the Garage bucket directly instead of probing.
          # GARAGE_S3_ENDPOINT: ${{ secrets.GARAGE_S3_ENDPOINT }}
          # GARAGE_BUCKET: ${{ secrets.GARAGE_BUCKET }}
          # GARAGE_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          # GARAGE_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}

          MODE: ${{ github.event.inputs.mode || 'normal' }}
          WORKERS: ${{ github.event.inputs.workers || '8' }}
        run: |
          ARGS="--workers $WORKERS"
          if [ "$MODE" = "only-missing" ]; then ARGS="$ARGS --only-missing"; fi
          if [ "$MODE" = "force" ]; then ARGS="$ARGS --force"; fi

          python manage.py sync_card_images $ARGS 2>&1 | tee sync.log

          # The command reports config/source errors and exits 0, so check the log.
          if grep -Eq "Failed: [1-9]|Found 0 files|Missing R2 config|Unsupported|Garage list failed" sync.log; then
            echo "::error::Image sync reported errors, see the log above."
            exit 1
          fi